services:
  - type: web
    name: gear-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build:node
    startCommand: npm run start:node
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
